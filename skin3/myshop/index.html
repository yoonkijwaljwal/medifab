<!--@layout(/layout/basic/layout.html)-->
<!--@css(/layout/basic/css/main.css)-->
<div class="pg-acc" data-hd="light">
<div module="layout_logincheck">
<!--
    $url = /member/login.html
-->
</div>

<div class="pg-acc__head">
	<h1 class="pg-acc__title">Account</h1>
</div>

<div class="pg-acc__body">
	<!--@import(/myshop/myshop_main.html)-->

	<div class="pg-acc__content">
		<div class="pg-acc__summary">
			<div class="pg-acc__greet" module="myshop_asyncbenefit">
				<div class="pg-acc__who">
					<p class="pg-acc__name">{$member_name} 님</p>
					<span class="pg-acc__badge pg-acc__badge--nation">내국인</span>
				</div>
				<a href="/member/modify.html" class="pg-acc__txtbtn">Profile</a>
			</div>
			<div module="myshop_asyncbankbook">
			<ul class="pg-acc__stats">
				<li>
					<a href="/myshop/order/list.html">
						<span class="pg-acc__stat-l">Orders</span>
						<span class="pg-acc__stat-v" data-acc-stat="orders">{$total_order_count}</span>
					</a>
				</li>
				<li>
					<a href="/myshop/coupon/coupon.html">
						<span class="pg-acc__stat-l">Coupons</span>
						<span class="pg-acc__stat-v" data-acc-stat="coupons">{$coupon_cnt}</span>
					</a>
				</li>
				<li>
					<a href="/myshop/mileage/historyList.html">
						<span class="pg-acc__stat-l">Points</span>
						<span class="pg-acc__stat-v" data-acc-stat="points">{$total_mileage}</span>
					</a>
				</li>
			</ul>
			</div>
		</div>

		<section class="pg-acc__orders">
			<div class="pg-acc__sec-head">
				<h2 class="pg-acc__sec-title">Recent Orders</h2>
				<a href="/myshop/order/list.html" class="pg-acc__txtbtn">View All</a>
			</div>
			<!--@import(/myshop/order/history_list_item.html)-->
		</section>
	</div>
</div>
</div>
