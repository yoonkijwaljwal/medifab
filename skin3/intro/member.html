<!--@layout(/layout/basic/intro.html)-->
<div module="Layout_stateLogon" id="pgGateLogon" style="position:absolute;width:0;height:0;overflow:hidden;" aria-hidden="true"></div>
<script>
(function() {
	function isLoggedIn() {
		try {
			if (typeof EC_FRONT_EXTERNAL_SCRIPT_VARIABLE_DATA !== 'undefined'
				&& EC_FRONT_EXTERNAL_SCRIPT_VARIABLE_DATA
				&& EC_FRONT_EXTERNAL_SCRIPT_VARIABLE_DATA.common_member_id_crypt) {
				return true;
			}
		} catch (e) {}
		try {
			if (typeof CAPP_ASYNC_METHODS !== 'undefined'
				&& CAPP_ASYNC_METHODS.AppCommon
				&& typeof CAPP_ASYNC_METHODS.AppCommon.getMemberInfo === 'function') {
				var info = CAPP_ASYNC_METHODS.AppCommon.getMemberInfo();
				if (info && info.member_id) return true;
			}
		} catch (e) {}
		var logon = document.getElementById('pgGateLogon');
		if (logon) {
			var cls = ' ' + logon.className + ' ';
			if (cls.indexOf(' xans-layout-statelogon ') !== -1 && cls.indexOf(' displaynone ') === -1) {
				return true;
			}
		}
		return false;
	}
	function returnUrl() {
		var url = '/index.html';
		try {
			var match = location.search.match(/[?&]returnUrl=([^&]*)/);
			if (match && match[1]) url = decodeURIComponent(match[1].replace(/\+/g, ' '));
		} catch (e) {}
		if (!url || url.charAt(0) !== '/' || url.indexOf('//') === 0) url = '/index.html';
		if (/\/intro\/member\.html/i.test(url) || /\/member\/login\.html/i.test(url)) url = '/index.html';
		return url;
	}
	if (isLoggedIn()) location.replace(returnUrl());
})();
</script>
<div module="Intro_memberPackage" class="pg-gate intro membership" data-gate data-view="landing">
	<!--@css(/css/module/intro/intro.css)-->
	<div class="pg-gate__visual">
		<img src="/SkinImg/img/medifab/gate_visual.png" alt="">
		<div class="pg-gate__dim"></div>
	</div>
	<header class="pg-gate__hd">
		<a href="/" class="pg-gate__logo"><img src="/svg/logo.svg" alt="MEDIFAB" width="134" height="32"></a>
		<a href="https://imedifab.com" class="pg-gate__corp" target="_blank" rel="noopener">CORPORATE SITE <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M17 7H9M17 7v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
	</header>
	<div class="pg-gate__form">
		<div class="pg-gate__panel" data-gate-panel="landing">
			<div class="pg-gate__copy">
				<h1 class="pg-gate__title pg-gate__title--xl">전문가 멤버십</h1>
				<p class="pg-gate__sub">MEDIFAB B2B Mall은 승인된 의료·메디컬 에스테틱 전문가 전용입니다. 회원 가입 후 회원 전용 가격, 임상 자료, 마케팅 자료를 이용하실 수 있습니다.</p>
			</div>
			<div class="pg-gate__btns">
				<button type="button" class="pg-gate__btn" data-gate-go="login">Login</button>
				<a href="/member/agreement.html{$skip_intro}" class="pg-gate__btn pg-gate__btn--solid">Apply Now</a>
			</div>
		</div>
		<div module="member_login" class="pg-gate__panel" data-gate-panel="login">
			<!--@css(/css/module/member/login.css)-->
			<!--
				$defaultReturnUrl = /index.html
				$forbidIpUrl = member/adminFail.html
			-->
			<div class="pg-gate__copy">
				<h1 class="pg-gate__title">Login</h1>
				<p class="pg-gate__sub">For approved members only.</p>
			</div>
			<fieldset class="form">
				<legend>회원로그인</legend>
				<div class="login">
					<label class="id ePlaceholder" title="ID">{$form.member_id}</label>
					<label class="password ePlaceholder" title="Password">{$form.member_passwd}</label>
				</div>
				<div class="wrap_security">
					<p class="login__security">
						{$form.member_check_save_id}
						<span class="secret">
							<input type="checkbox" id="secur_check" checked disabled>
						</span>
						<label for="secur_check">보안접속</label>
					</p>
				</div>
				<div class="login__button">
					<a href="#none" class="btnSubmit gFull sizeL" onclick="{$action_func_login}">Login</a>
				</div>
				<div class="pg-gate__more">
					<p class="pg-gate__find">Find <a href="/member/id/find_id.html{$skip_intro}">ID</a> <a href="/member/passwd/find_passwd_info.html{$skip_intro}">Password</a></p>
					<a href="/member/agreement.html{$skip_intro}" class="pg-gate__apply">Apply Now</a>
				</div>
				<div class="login__sns">
					<div class="sns_h">SNS 로그인</div>
					<div class="wrap_sns_log">
						<a href="#none" class="btnKakao {$display_kakao|display}" onclick="{$kakao_func_login}">카카오 로그인</a>
						<a href="#none" class="btnNaver {$display_naver|display}" onclick="{$naver_func_login}">네이버 로그인</a>
						<a href="#none" class="btnFacebook {$display_facebook|display}" onclick="{$facebook_func_login}">페이스북 로그인</a>
						<a href="#none" class="btnLine {$display_line|display}" onclick="{$line_func_login}">라인 로그인</a>
						<a href="#none" class="btnGoogle {$display_google|display}" onclick="{$google_func_login}">구글 로그인</a>
						<a href="#none" class="btnApple {$display_apple|display}" onclick="{$apple_func_login}">애플 로그인</a>
					</div>
				</div>
			</fieldset>
		</div>
	</div>
</div>
<script>
(function() {
	function isLoggedIn() {
		try {
			if (typeof EC_FRONT_EXTERNAL_SCRIPT_VARIABLE_DATA !== 'undefined'
				&& EC_FRONT_EXTERNAL_SCRIPT_VARIABLE_DATA
				&& EC_FRONT_EXTERNAL_SCRIPT_VARIABLE_DATA.common_member_id_crypt) {
				return true;
			}
		} catch (e) {}
		try {
			if (typeof CAPP_ASYNC_METHODS !== 'undefined'
				&& CAPP_ASYNC_METHODS.AppCommon
				&& typeof CAPP_ASYNC_METHODS.AppCommon.getMemberInfo === 'function') {
				var info = CAPP_ASYNC_METHODS.AppCommon.getMemberInfo();
				if (info && info.member_id) return true;
			}
		} catch (e) {}
		var logon = document.getElementById('pgGateLogon');
		if (logon) {
			var cls = ' ' + logon.className + ' ';
			if (cls.indexOf(' xans-layout-statelogon ') !== -1 && cls.indexOf(' displaynone ') === -1) {
				return true;
			}
		}
		return false;
	}
	function returnUrl() {
		var url = '/index.html';
		try {
			var match = location.search.match(/[?&]returnUrl=([^&]*)/);
			if (match && match[1]) url = decodeURIComponent(match[1].replace(/\+/g, ' '));
		} catch (e) {}
		if (!url || url.charAt(0) !== '/' || url.indexOf('//') === 0) url = '/index.html';
		if (/\/intro\/member\.html/i.test(url) || /\/member\/login\.html/i.test(url)) url = '/index.html';
		return url;
	}
	if (isLoggedIn()) {
		location.replace(returnUrl());
		return;
	}

	var root = document.querySelector('[data-gate]');
	if (!root) return;
	function show(name) {
		root.setAttribute('data-view', name);
	}
	show('landing');
	root.addEventListener('click', function(e) {
		var go = e.target.closest('[data-gate-go]');
		if (!go) return;
		e.preventDefault();
		show(go.getAttribute('data-gate-go'));
	});
})();
</script>
