<!--@layout(/layout/basic/layout.html)-->
<!--@css(/css/module/intro/intro.css)-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300&family=Noto+Serif:wght@300&display=swap" rel="stylesheet">
<div class="pg-gate is-login is-find is-find-id" data-hd="light">
	<div class="pg-gate__visual">
		<img src="/SkinImg/img/medifab/gate_visual.png" alt="">
		<div class="pg-gate__dim"></div>
	</div>
	<header class="pg-gate__hd">
		<a href="/" class="pg-gate__logo"><img src="/svg/logo.svg" alt="MEDIFAB" width="134" height="32"></a>
		<a href="https://imedifab.com" class="pg-gate__corp" target="_blank" rel="noopener">CORPORATE SITE <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M17 7H9M17 7v8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
	</header>
	<div class="pg-gate__form">
		<div module="member_findidresult" class="pg-gate__panel memberArea">
			<!--@css(/css/module/member/find_id.css)-->
			<!--@css(/css/module/member/find_id_result.css)-->
			<div class="pg-gate__copy">
				<h1 class="pg-gate__title">Find ID</h1>
			</div>
			<div class="ec-base-box typeMember">
				<div class="complete">
					<p class="headDesc">고객님 아이디 찾기가 완료 되었습니다.</p>
					<p class="infoDesc">가입된 아이디가 총 <span class="txtEm">{$idCnt}</span>개 있습니다.</p>
					<div class="description">
						<ul class="ec-base-desc gSmall">
							<li><strong class="term">이름</strong><div class="desc">{$name}</div></li>
							<li><strong class="term">{$searchType}</strong><div class="desc">{$searchInfo}</div></li>
						</ul>
						{$searchIds}
					</div>
				</div>
			</div>
			<div class="ec-base-button gBottom">
				<a href="javascript:go_findlogin('{$id}');" class="btnSubmitFix sizeM">Login</a>
				<a href="javascript:go_findpwd('{$id}','{$mtype}');" class="btnNormalFix sizeM">Find Password</a>
			</div>
		</div>
	</div>
</div>
